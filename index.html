<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lấy toạ độ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .circle-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      background: #0284c7;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .circle-btn:active { transform: scale(0.96); }
    #status {
      margin-top: 24px;
      font-size: 15px;
      text-align: center;
      line-height: 1.6;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <button id="btn" class="circle-btn">
    <span style="font-size: 28px;">📍</span>
    <span>Lấy toạ độ</span>
  </button>

  <p id="status">Chạm vào nút tròn để kiểm tra vị trí</p>

  <script>
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    btn.onclick = () => {
      if (!navigator.geolocation) {
        status.innerText = "Trình duyệt không hỗ trợ Geolocation.";
        return;
      }
      status.innerText = "Đang kết nối GPS...";
      
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = Math.round(pos.coords.accuracy);
          status.style.color = "#38bdf8";
          status.innerHTML = `Vĩ độ: <b>${lat.toFixed(6)}</b><br>` +
                             `Kinh độ: <b>${lon.toFixed(6)}</b><br>` +
                             `Độ chính xác: ~${acc}m`;
        },
        (err) => {
          status.style.color = "#f87171";
          if (err.code === 1) status.innerText = "Bạn đã từ chối cấp quyền vị trí.";
          else if (err.code === 2) status.innerText = "Không thể lấy toạ độ vị trí.";
          else if (err.code === 3) status.innerText = "Hết thời gian chờ phản hồi GPS.";
          else status.innerText = "Lỗi: " + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    };
  </script>
</body>
</html>
